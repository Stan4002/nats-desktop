[project]
name = "nats-desktop"
version = "0.1.0"
description = "Native Linux desktop client for the local NATS Assistant API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
nats-desktop = "nats_desktop.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
